<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STUDIO | TASARIM VİTRİNİ</title>
  <!-- Supabase Kütüphanesi -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #ffffff;
      --text: #000000;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
    }

    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding-bottom: 50px; 
      -webkit-font-smoothing: antialiased; 
    }

    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 20px 40px; 
      border-bottom: 1px solid var(--text); 
      background: var(--bg);
    }
    .logo { 
      font-size: 24px; 
      font-weight: bold; 
      letter-spacing: 4px; 
    }

    .header-actions {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .user-info {
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .btn-outline { 
      background: var(--bg); 
      color: var(--text); 
      border: 1px solid var(--text); 
      padding: 10px 20px; 
      font-size: 12px; 
      font-weight: bold; 
      letter-spacing: 2px; 
      text-transform: uppercase; 
      cursor: pointer; 
      transition: all 0.2s;
    }
    .btn-outline:hover { 
      background: var(--text); 
      color: var(--bg); 
    }

    .container { 
      max-width: 1200px; 
      margin: 40px auto; 
      padding: 0 20px; 
    }

    .nav-tabs { 
      display: flex; 
      gap: 30px; 
      margin-bottom: 40px; 
      border-bottom: 1px solid var(--text); 
    }
    .tab-btn { 
      background: none; 
      border: none; 
      padding-bottom: 10px; 
      font-size: 14px; 
      font-weight: bold; 
      letter-spacing: 2px; 
      color: var(--text); 
      cursor: pointer; 
      opacity: 0.4;
      text-transform: uppercase;
    }
    .tab-btn.active { 
      opacity: 1; 
      border-bottom: 3px solid var(--text); 
    }

    .grid { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 40px; 
    }

    .card { 
      border: 1px solid var(--text); 
      display: flex; 
      flex-direction: column; 
    }
    .card-img { 
      width: 100%; 
      aspect-ratio: 2 / 3; 
      object-fit: cover; 
      border-bottom: 1px solid var(--text);
      filter: grayscale(100%); 
      transition: filter 0.3s;
    }
    .card:hover .card-img {
      filter: grayscale(0%);
    }

    .card-body { 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      flex: 1; 
    }
    .card-title { 
      font-size: 16px; 
      font-weight: bold; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
      margin-bottom: 5px; 
    }
    .card-designer { 
      font-size: 12px; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
      margin-bottom: 20px; 
      opacity: 0.6;
    }

    .card-footer { 
      margin-top: auto; 
      display: flex; 
      justify-content: flex-end; 
      align-items: center; 
      border-top: 1px solid var(--text); 
      padding-top: 15px; 
    }
    
    .actions { 
      display: flex; 
      gap: 10px; 
      width: 100%;
      justify-content: space-between;
    }

    .modal { 
      display: none; 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: rgba(255, 255, 255, 0.95); 
      justify-content: center; 
      align-items: center; 
      z-index: 999; 
    }
    .modal-content { 
      background: var(--bg); 
      border: 2px solid var(--text); 
      padding: 40px; 
      width: 100%; 
      max-width: 450px; 
      position: relative; 
    }
    .close-btn { 
      position: absolute; 
      top: 20px; 
      right: 20px; 
      font-size: 20px; 
      font-weight: bold; 
      cursor: pointer; 
      background: none;
      border: none;
    }
    .form-label { 
      display: block; 
      font-size: 11px; 
      font-weight: bold; 
      letter-spacing: 1px; 
      text-transform: uppercase; 
      margin-bottom: 8px; 
      margin-top: 20px;
    }
    .form-input { 
      width: 100%; 
      padding: 12px; 
      border: 1px solid var(--text); 
      font-size: 14px; 
      background: var(--bg);
      color: var(--text);
      outline: none;
    }
    .form-input:focus {
      background: var(--text);
      color: var(--bg);
    }
    .modal-title {
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-bottom: 2px solid var(--text);
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div class="logo">STUDIO.</div>
    <div class="header-actions">
      <span id="userDisplay" class="user-info hidden"></span>
      <button id="authBtn" class="btn-outline" onclick="openModal('authModal')">GİRİŞ YAP</button>
      <button id="logoutBtn" class="btn-outline hidden" onclick="handleLogout()">ÇIKIŞ YAP</button>
      <button class="btn-outline" onclick="checkAuthAndOpenUpload()">YENİ TASARIM EKLE</button>
    </div>
  </header>

  <div class="container">
    <div class="nav-tabs">
      <button class="tab-btn active" id="tab-explore" onclick="switchTab('explore')">VITRIN</button>
      <button class="tab-btn" id="tab-profile" onclick="switchTab('profile')">PROFILIM</button>
    </div>

    <!-- VİTRİN BÖLÜMÜ -->
    <div id="view-explore">
      <div class="grid" id="exploreGrid">
        <p style="text-align: center; grid-column: 1/-1;">YÜKLENİYOR...</p>
      </div>
    </div>

    <!-- PROFİL BÖLÜMÜ -->
    <div id="view-profile" class="hidden">
      <div style="margin-bottom: 40px; border: 1px solid #000; padding: 30px;">
        <h2 id="profileTitle" style="font-size: 20px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px;">PROFILIM</h2>
        <p style="font-size: 12px; letter-spacing: 1px; text-transform: uppercase;">YUKLEDIGINIZ TASARIMLAR BURADA LISTELENIR</p>
      </div>
      <div class="grid" id="profileGrid"></div>
    </div>
  </div>

  <!-- GİRİŞ / KAYIT MODALI -->
  <div class="modal" id="authModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal('authModal')">X</button>
      <div class="modal-title" id="authModalTitle">GİRİŞ YAP</div>
      
      <label class="form-label">E-POSTA</label>
      <input type="email" id="authEmail" class="form-input" placeholder="ornek@email.com">
      
      <label class="form-label">ŞİFRE</label>
      <input type="password" id="authPassword" class="form-input" placeholder="******">
      
      <button class="btn-outline" id="authSubmitBtn" style="width: 100%; margin-top: 30px;" onclick="handleAuth()">GİRİŞ YAP</button>

      <div style="margin-top: 20px; text-align: center;">
        <button id="toggleAuthModeBtn" style="background:none; border:none; font-size: 11px; letter-spacing: 1px; cursor:pointer; text-decoration: underline;" onclick="toggleAuthMode()">Hesabın yok mu? Kayıt Ol</button>
      </div>
    </div>
  </div>

  <!-- YÜKLEME MODALI -->
  <div class="modal" id="uploadModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal('uploadModal')">X</button>
      <div class="modal-title">TASARIM YUKLE</div>
      
      <label class="form-label">TASARIM BASLIGI</label>
      <input type="text" id="inputTitle" class="form-input" placeholder="ORNEK: SIYAH CEKET">
      
      <label class="form-label">GORSEL LINKI (URL)</label>
      <input type="text" id="inputImage" class="form-input" placeholder="HTTPS://...">
      
      <button class="btn-outline" style="width: 100%; margin-top: 30px;" onclick="addDesign()">YAYINLA</button>
    </div>
  </div>

  <script>
    // -----------------------------------------------------------
    // SUPABASE BAGLANTISI
    // -----------------------------------------------------------
    const SUPABASE_URL = "fkeygwgfxgxuhojjdrtj";
    const SUPABASE_KEY = "eu-central-1";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let authMode = 'login'; // 'login' veya 'signup'
    let designs = [];

    // Oturum Durumunu Kontrol Et
    async function checkUserSession() {
      const { data: { session } } = await db.auth.getSession();
      updateUserUI(session?.user || null);

      db.auth.onAuthStateChange((_event, session) => {
        updateUserUI(session?.user || null);
      });
    }

    function updateUserUI(user) {
      currentUser = user;
      const userDisplay = document.getElementById('userDisplay');
      const authBtn = document.getElementById('authBtn');
      const logoutBtn = document.getElementById('logoutBtn');
      const profileTitle = document.getElementById('profileTitle');

      if (user) {
        userDisplay.textContent = user.email;
        userDisplay.classList.remove('hidden');
        authBtn.classList.add('hidden');
        logoutBtn.classList.remove('hidden');
        profileTitle.textContent = "@" + user.email.split('@')[0].toUpperCase();
      } else {
        userDisplay.classList.add('hidden');
        authBtn.classList.remove('hidden');
        logoutBtn.classList.add('hidden');
        profileTitle.textContent = "PROFILIM (MISAFIR)";
      }
      fetchDesigns();
    }

    // Giriş / Kayıt İşlemleri
    async function handleAuth() {
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;

      if (!email || !password) return alert("E-POSTA VE ŞİFRE ALANLARI BOŞ BIRAKILAMAZ.");

      if (authMode === 'login') {
        const { error } = await db.auth.signInWithPassword({ email, password });
        if (error) alert("Giriş Hatası: " + error.message);
        else closeModal('authModal');
      } else {
        const { error } = await db.auth.signUp({ email, password });
        if (error) alert("Kayıt Hatası: " + error.message);
        else {
          alert("Kayıt başarılı! Giriş yapılıyor.");
          closeModal('authModal');
        }
      }
    }

    async function handleLogout() {
      await db.auth.signOut();
      alert("Çıkış yapıldı.");
    }

    function toggleAuthMode() {
      const title = document.getElementById('authModalTitle');
      const submitBtn = document.getElementById('authSubmitBtn');
      const toggleBtn = document.getElementById('toggleAuthModeBtn');

      if (authMode === 'login') {
        authMode = 'signup';
        title.textContent = 'KAYIT OL';
        submitBtn.textContent = 'KAYIT OL';
        toggleBtn.textContent = 'Zaten hesabın var mı? Giriş Yap';
      } else {
        authMode = 'login';
        title.textContent = 'GİRİŞ YAP';
        submitBtn.textContent = 'GİRİŞ YAP';
        toggleBtn.textContent = 'Hesabın yok mu? Kayıt Ol';
      }
    }

    function checkAuthAndOpenUpload() {
      if (!currentUser) {
        alert("Tasarım yüklemek için önce giriş yapmalısınız.");
        openModal('authModal');
      } else {
        openModal('uploadModal');
      }
    }

    // Veritabanından Tasarımları Çekme
    async function fetchDesigns() {
      const { data, error } = await db.from('designs').select('*').order('likes', { ascending: false });
      if (error) return console.error(error);

      designs = data || [];
      renderDesigns();
    }

    function renderDesigns() {
      const exploreGrid = document.getElementById('exploreGrid');
      const profileGrid = document.getElementById('profileGrid');

      if (designs.length === 0) {
        exploreGrid.innerHTML = `<p style="grid-column: 1/-1; text-align: center;">HENÜZ TASARIM EKLENMEDİ.</p>`;
        profileGrid.innerHTML = `<p style="grid-column: 1/-1; text-align: center;">HENÜZ TASARIM EKLENMEDİ.</p>`;
        return;
      }

      exploreGrid.innerHTML = designs.map(d => createCardHtml(d)).join('');
      
      const myDesigns = currentUser ? designs.filter(d => d.designer === currentUser.email) : [];
      profileGrid.innerHTML = myDesigns.length > 0 
        ? myDesigns.map(d => createCardHtml(d, true)).join('')
        : `<p style="grid-column: 1/-1; text-align: center;">YÜKLEDİĞİNİZ TASARIM BULUNMUYOR.</p>`;
    }

    function createCardHtml(d, isProfile = false) {
      return `
        <div class="card">
          <img class="card-img" src="${d.image_url}" alt="${d.title}">
          <div class="card-body">
            <div class="card-title">${d.title}</div>
            <div class="card-designer">TASARIMCI: ${d.designer || 'ANONİM'}</div>
            <div class="card-footer">
              <div class="actions">
                <button class="btn-outline" onclick="likeDesign(${d.id}, ${d.likes})">ADD FAVORITE (${d.likes})</button>
                ${isProfile 
                  ? `<button class="btn-outline" onclick="deleteDesign(${d.id})">SIL</button>` 
                  : `<button class="btn-outline" onclick="buyDesign('${d.title}')">BUY</button>`
                }
              </div>
            </div>
          </div>
        </div>
      `;
    }

    async function likeDesign(id, currentLikes) {
      const { error } = await db.from('designs').update({ likes: currentLikes + 1 }).eq('id', id);
      if (!error) fetchDesigns();
    }

    async function addDesign() {
      if (!currentUser) return alert("Lütfen giriş yapın.");

      const title = document.getElementById('inputTitle').value;
      const imageUrl = document.getElementById('inputImage').value || "https://images.unsplash.com/photo-1550614000-4b95d4edfa22?w=600&q=80";

      if (!title) return alert("BASLIK ALANI ZORUNLUDUR.");

      const { error } = await db.from('designs').insert([
        { 
          title: title.toUpperCase(), 
          designer: currentUser.email, 
          image_url: imageUrl, 
          likes: 0, 
          is_mine: true 
        }
      ]);

      if (error) {
        alert("Hata: " + error.message);
      } else {
        closeModal('uploadModal');
        document.getElementById('inputTitle').value = '';
        document.getElementById('inputImage').value = '';
        fetchDesigns();
      }
    }

    async function deleteDesign(id) {
      if (confirm("BU TASARIMI SILMEK ISTIYOR MUSUNUZ?")) {
        const { error } = await db.from('designs').delete().eq('id', id);
        if (!error) fetchDesigns();
      }
    }

    function buyDesign(title) {
      alert("[" + title + "] SATIN ALMA / LISANSLAMA TALEBI ALINDI.");
    }

    function switchTab(tab) {
      document.getElementById('view-explore').classList.add('hidden');
      document.getElementById('view-profile').classList.add('hidden');
      document.getElementById('tab-explore').classList.remove('active');
      document.getElementById('tab-profile').classList.remove('active');

      if (tab === 'explore') {
        document.getElementById('view-explore').classList.remove('hidden');
        document.getElementById('tab-explore').classList.add('active');
      } else {
        document.getElementById('view-profile').classList.remove('hidden');
        document.getElementById('tab-profile').classList.add('active');
      }
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    checkUserSession();
  </script>
</body>
</html>
